services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermex
      POSTGRES_PASSWORD: hermex
      POSTGRES_DB: hermex
    ports:
      - "5432:5432"
    volumes:
      - hermex_pgdata:/var/lib/postgresql/data

volumes:
  hermex_pgdata:
